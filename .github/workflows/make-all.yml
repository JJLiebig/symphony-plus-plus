name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  browser-native-acceptance:
    name: browser native acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMPP_BROWSER_ACCEPTANCE: '1'
      E2E_OAUTH_CREDENTIALS: '{}'
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout candidate combined tree
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up candidate toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Select tool binaries and isolated build homes
        working-directory: elixir
        run: |
          echo "$(mise where node)/bin" >> "$GITHUB_PATH"
          echo "$(mise where erlang)/bin" >> "$GITHUB_PATH"
          echo "$(mise where elixir)/bin" >> "$GITHUB_PATH"
          echo "MIX_HOME=$RUNNER_TEMP/sympp-browser-mix" >> "$GITHUB_ENV"
          echo "MIX_ARCHIVES=$RUNNER_TEMP/sympp-browser-mix/archives" >> "$GITHUB_ENV"
      - name: Record candidate identity
        run: |
          mkdir -p .e2e
          git rev-parse HEAD > .e2e/browser-checkout-sha.txt
          git show -s --format='%H %P' HEAD > .e2e/browser-checkout-parents.txt
          echo "ACCEPTANCE_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install locked native browser dependencies
        run: |
          npm ci --ignore-scripts
          npm exec -- e2e-web install chromium --with-deps
      - name: Build candidate backend
        working-directory: elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Build candidate browser and inspector
        working-directory: elixir/assets
        run: |
          npm ci
          npm run build
          npm run build:herdr
      - name: Prove unrecorded model calls fail before transport
        env:
          SYMPP_BROWSER_NEGATIVE: '1'
        run: |
          set +e
          npm exec -- e2e run --target browser --grep 'operator sees dependency' --output .e2e/browser-negative
          result=$?
          set -e
          test "$result" -ne 0
          node tests/support/browser-report.ts negative
          mv .e2e/model-denials.jsonl .e2e/browser-negative/model-denials.jsonl
      - name: Exercise live mechanical journeys and export actual GET observations
        env:
          SYMPP_BROWSER_MECHANICAL: '1'
        run: |
          npm exec -- e2e run --target browser --output .e2e/browser-mechanical
          node tests/support/browser-report.ts mechanical
      - name: Replay unchanged native recordings against live candidate
        run: |
          npm exec -- e2e run --target browser --output .e2e/browser-replay --strict-cache
          node tests/support/browser-report.ts replay
          test ! -f .e2e/model-denials.jsonl
          git diff --exit-code -- .e2e/cache
      - name: Retain all browser attempts and GET provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-native-evidence
          path: .e2e
          include-hidden-files: true

  browser-candidate-artifact:
    name: browser candidate artifact
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      E2E_OAUTH_CREDENTIALS: '{}'
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/.e2e/browser-binaries'
    steps:
      - name: Checkout candidate combined tree
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up candidate Node toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
          working_directory: elixir
      - name: Install Node only
        working-directory: elixir
        run: mise install node
      - name: Select Node binary
        working-directory: elixir
        shell: pwsh
        run: (mise where node) >> $env:GITHUB_PATH
      - name: Generate acceptance lock on hosted runner
        run: npm install --package-lock-only --ignore-scripts
      - name: Install isolated recording dependencies
        run: |
          npm ci --ignore-scripts
          npm exec -- e2e-web install chromium
      - name: Build candidate browser and inspector artifacts
        working-directory: elixir/assets
        run: |
          npm ci
          npm run build
          npm run build:herdr
      - name: Package recording inputs without runtime credentials
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .e2e/browser-candidate -Force | Out-Null
          git rev-parse HEAD | Set-Content .e2e/browser-candidate/checkout-sha.txt
          git show -s --format='%H %P' HEAD | Set-Content .e2e/browser-candidate/checkout-parents.txt
          tar -cf .e2e/browser-candidate/recording-dependencies.tar node_modules
          tar -cf .e2e/browser-candidate/browser-binaries.tar -C .e2e browser-binaries
          Copy-Item package-lock.json .e2e/browser-candidate/package-lock.json
          Copy-Item elixir/priv/static .e2e/browser-candidate/static -Recurse
          Copy-Item plugins/symphony-plus-plus-mcp/herdr/dist .e2e/browser-candidate/inspector -Recurse
      - name: Retain hosted candidate recording inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-candidate-artifact
          path: .e2e/browser-candidate
          include-hidden-files: true

  native-acceptance:
    name: native acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_OAUTH_CREDENTIALS: '{}'
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout candidate combined tree
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up candidate toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Select native tool binaries before isolating runtime homes
        working-directory: elixir
        run: |
          echo "$(mise where node)/bin" >> "$GITHUB_PATH"
          echo "$(mise where erlang)/bin" >> "$GITHUB_PATH"
          echo "$(mise where elixir)/bin" >> "$GITHUB_PATH"
      - name: Record candidate identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .e2e
          git rev-parse HEAD > .e2e/checkout-sha.txt
          git show -s --format='%H %P' HEAD > .e2e/checkout-parents.txt
          echo "ACCEPTANCE_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MIX_HOME=$RUNNER_TEMP/sympp-acceptance-mix" >> "$GITHUB_ENV"
          echo "MIX_ARCHIVES=$RUNNER_TEMP/sympp-acceptance-mix/archives" >> "$GITHUB_ENV"
          printf 'head=%s\nbase=%s\nrun=%s\n' "$HEAD_SHA" "$BASE_SHA" "$GITHUB_RUN_ID" > .e2e/inputs.txt
      - name: Retain dependency lock
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-dependency-lock
          path: package-lock.json
      - name: Install locked acceptance dependencies
        run: npm ci --ignore-scripts
      - name: Build candidate source
        working-directory: elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Prove native bootstrap and health isolation
        run: |
          start=$SECONDS
          npm run test:e2e
          echo "$((SECONDS-start))" > .e2e/acceptance-wall-seconds.txt
          node scripts/acceptance/check-report.mjs
      - name: Retain acceptance evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-evidence
          path: .e2e
          include-hidden-files: true

  portable-skills:
    name: Windows installed runtime
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      E2E_OAUTH_CREDENTIALS: '{}'
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      SYMPP_INSTALLED_ACCEPTANCE: '1'
      ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up acceptance Node
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: node@26.3.0
      - name: Install locked acceptance dependencies
        run: npm ci --ignore-scripts
      - name: Record installed candidate identity
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          New-Item -ItemType Directory -Path .e2e -Force | Out-Null
          git show -s --format='%H %P' HEAD > .e2e/checkout-parents.txt
          git cat-file -p HEAD > .e2e/checkout-commit.txt
          "ACCEPTANCE_CHECKOUT_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          @{ head = $env:ACCEPTANCE_HEAD_SHA; base = $env:BASE_SHA; run = $env:GITHUB_RUN_ID } | ConvertTo-Json > .e2e/inputs.json
          # Native marketplace clones fetch branch commits, not GitHub's synthetic merge ref.
          git fetch --no-tags --depth=1 origin $env:ACCEPTANCE_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch marketplace candidate head' }
          $headTree = git rev-parse "$($env:ACCEPTANCE_HEAD_SHA)^{tree}"
          $combinedTree = git rev-parse 'HEAD^{tree}'
          @{ headTree = $headTree; combinedTree = $combinedTree } | ConvertTo-Json > .e2e/marketplace-tree-identity.json
          if ($headTree -ne $combinedTree) { throw 'Refresh the branch from current beta before marketplace qualification' }
      - name: Generate portable bundle
        run: node scripts/package-portable-skills.mjs
      - name: Retain generated portable mirror
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-skills-mirror
          path: skills/symphony-plus-plus
          include-hidden-files: true
      - name: Verify generated bundle and setup behavior
        run: |
          node scripts/package-portable-skills.mjs --check
          node plugins/symphony-plus-plus-mcp/tests/launcher/portable-install-tests.js
      - name: Install native configuration hosts
        id: native-hosts
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codex.zip'
          Invoke-WebRequest 'https://github.com/JJLiebig/codex/releases/download/codex-plus-plus-v0.160.1-fork.2/codex-plus-plus-0.160.1-fork.2-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'b94586943af5eaea75c6a8ac912e5f47f757e96faebd0585357bb403356960b9') { throw 'Codex archive checksum mismatch' }
          $bin = Join-Path $env:RUNNER_TEMP 'native-hosts'
          Expand-Archive $archive $bin
          (Get-ChildItem $bin -Recurse -Filter codex.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
          npm install --global @anthropic-ai/claude-code@2.1.292
          if ($LASTEXITCODE -ne 0) { throw 'Claude installation failed' }
      - name: Prove real Skills and marketplace user journeys
        run: |
          npm exec -- e2e run tests/acceptance/installed-runtime.e2e.ts --target api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/support/installed-report.ts tests/acceptance/installed-runtime.e2e.ts
      - name: Prove native registration and published runtime processes
        if: ${{ !cancelled() && steps.native-hosts.outcome == 'success' }}
        run: node scripts/qualify-portable-skills.mjs
      - name: Require committed generated mirror
        if: ${{ !cancelled() && steps.native-hosts.outcome == 'success' }}
        run: git diff --exit-code -- skills/symphony-plus-plus
      - name: Retain installed acceptance evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-runtime-evidence
          path: .e2e
          include-hidden-files: true

  offline-acceptance:
    name: offline copy acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_OAUTH_CREDENTIALS: '{}'
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      SYMPP_OFFLINE_ACCEPTANCE: '1'
    steps:
      - name: Checkout candidate combined tree
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up candidate toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Record identity and isolate build tools
        working-directory: elixir
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "$(mise where node)/bin" >> "$GITHUB_PATH"
          echo "$(mise where erlang)/bin" >> "$GITHUB_PATH"
          echo "$(mise where elixir)/bin" >> "$GITHUB_PATH"
          echo "ACCEPTANCE_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MIX_HOME=$RUNNER_TEMP/sympp-offline-mix" >> "$GITHUB_ENV"
          echo "MIX_ARCHIVES=$RUNNER_TEMP/sympp-offline-mix/archives" >> "$GITHUB_ENV"
          mkdir -p ../.e2e
          git show -s --format='%H %P' HEAD > ../.e2e/checkout-parents.txt
          git cat-file -p HEAD > ../.e2e/checkout-commit.txt
          printf 'head=%s\nbase=%s\nrun=%s\n' "$HEAD_SHA" "$BASE_SHA" "$GITHUB_RUN_ID" > ../.e2e/inputs.txt
      - name: Install locked acceptance dependencies
        run: npm ci --ignore-scripts
      - name: Build candidate source
        working-directory: elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Prove online copy and offline replacement boundaries
        run: |
          npm exec -- e2e run tests/acceptance/offline-copy.e2e.ts --target api
          node tests/support/installed-report.ts tests/acceptance/offline-copy.e2e.ts
      - name: Retain offline acceptance evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-copy-evidence
          path: .e2e
          include-hidden-files: true

  beta-snapshot:
    name: beta snapshot safety
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Check online SQLite snapshot
        run: python -m unittest discover -s scripts/tests -p test_sympp_beta_snapshot.py
      - name: Check beta launcher isolation and refusal paths
        shell: pwsh
        run: ./plugins/symphony-plus-plus-mcp/tests/launcher/run-launcher-tests.ps1 -SkipDesktopTests

  single-gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            target: ci-static
            partition: ""
            partitions: ""
          - name: test 9/9
            target: ci-test
            partition: 9
            partitions: 9
          - name: slow test 1/8
            target: ci-slow
            partition: 1
            partitions: 8
          - name: slow test 2/8
            target: ci-slow
            partition: 2
            partitions: 8
          - name: slow test 3/8
            target: ci-slow
            partition: 3
            partitions: 8
          - name: slow test 4/8
            target: ci-slow
            partition: 4
            partitions: 8
          - name: slow test 5/8
            target: ci-slow
            partition: 5
            partitions: 8
          - name: slow test 6/8
            target: ci-slow
            partition: 6
            partitions: 8
          - name: slow test 7/8
            target: ci-slow
            partition: 7
            partitions: 8
          - name: slow test 8/8
            target: ci-slow
            partition: 8
            partitions: 8
          - name: dialyzer
            target: ci-dialyzer
            partition: ""
            partitions: ""
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Cache dialyzer PLTs
        if: ${{ matrix.target == 'ci-dialyzer' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/_build/dialyzer
            elixir/_build/*/dialyxir_*.plt
            elixir/_build/*/dialyxir_*.plt.hash
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-

      - name: Verify ${{ matrix.name }}
        run: make ${{ matrix.target }}
        env:
          FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
          SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
          MIX_TEST_PARTITION: ${{ matrix.partition }}

      - name: Retain static and test gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ matrix.target }}-${{ matrix.partition || 'single' }}
          path: elixir/_build/make-logs

  parallel-gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test 1-2/9
            partitions: 9
            partition_1: 1
            partition_2: 2
            gate_id: fast-1-2
          - name: test 3-4/9
            partitions: 9
            partition_1: 3
            partition_2: 4
            gate_id: fast-3-4
          - name: test 5-6/9
            partitions: 9
            partition_1: 5
            partition_2: 6
            gate_id: fast-5-6
          - name: test 7-8/9
            partitions: 9
            partition_1: 7
            partition_2: 8
            gate_id: fast-7-8
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Prepare ${{ matrix.name }} build copies
        run: |
          make ci-prepare
          rm -rf "_p/${{ matrix.gate_id }}"
          mkdir -p "_p/${{ matrix.gate_id }}"
          cp -a _build "_p/${{ matrix.gate_id }}/b${{ matrix.partition_1 }}"
          cp -a _build "_p/${{ matrix.gate_id }}/b${{ matrix.partition_2 }}"
          mkdir -p "/tmp/spp-mix-${{ matrix.gate_id }}-${{ matrix.partition_1 }}" "/tmp/spp-mix-${{ matrix.gate_id }}-${{ matrix.partition_2 }}"
          mkdir -p "/tmp/spp-tmp-${{ matrix.gate_id }}-${{ matrix.partition_1 }}" "/tmp/spp-tmp-${{ matrix.gate_id }}-${{ matrix.partition_2 }}"
        env:
          GATE_RUN_ID: ${{ matrix.gate_id }}-prepare

      - parallel:
          - name: test ${{ matrix.partition_1 }}/${{ matrix.partitions }}
            run: make ci-test-run
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_1 }}
              MIX_BUILD_PATH: _p/${{ matrix.gate_id }}/b${{ matrix.partition_1 }}
              MIX_HOME: /tmp/spp-mix-${{ matrix.gate_id }}-${{ matrix.partition_1 }}
              TMPDIR: /tmp/spp-tmp-${{ matrix.gate_id }}-${{ matrix.partition_1 }}
              GATE_LOG_ROOT: _p/${{ matrix.gate_id }}/l
              GATE_RUN_ID: ${{ matrix.gate_id }}-${{ matrix.partition_1 }}
              ELIXIR_ERL_OPTIONS: "+S 2:2"

          - name: test ${{ matrix.partition_2 }}/${{ matrix.partitions }}
            run: make ci-test-run
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_2 }}
              MIX_BUILD_PATH: _p/${{ matrix.gate_id }}/b${{ matrix.partition_2 }}
              MIX_HOME: /tmp/spp-mix-${{ matrix.gate_id }}-${{ matrix.partition_2 }}
              TMPDIR: /tmp/spp-tmp-${{ matrix.gate_id }}-${{ matrix.partition_2 }}
              GATE_LOG_ROOT: _p/${{ matrix.gate_id }}/l
              GATE_RUN_ID: ${{ matrix.gate_id }}-${{ matrix.partition_2 }}
              ELIXIR_ERL_OPTIONS: "+S 2:2"

      - name: Retain partition test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ matrix.gate_id }}
          path: elixir/_p/${{ matrix.gate_id }}/l

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir/assets
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('elixir/assets/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check frontend quality
        run: npm run quality

      - name: Build production frontend
        run: npm run build

      - name: Build Herdr inspector
        run: npm run build:herdr

  make-all:
    runs-on: ubuntu-latest
    needs:
      - browser-native-acceptance
      - browser-candidate-artifact
      - native-acceptance
      - portable-skills
      - offline-acceptance
      - beta-snapshot
      - single-gates
      - parallel-gates
      - frontend
    if: ${{ always() }}
    steps:
      - name: Verify split gates
        run: |
          if [ "${{ needs.browser-native-acceptance.result }}" != "success" ]; then
            echo "browser native acceptance result: ${{ needs.browser-native-acceptance.result }}"
            exit 1
          fi
          if [ "${{ needs.browser-candidate-artifact.result }}" != "success" ]; then
            echo "browser candidate artifact result: ${{ needs.browser-candidate-artifact.result }}"
            exit 1
          fi
          if [ "${{ needs.native-acceptance.result }}" != "success" ]; then
            echo "native acceptance result: ${{ needs.native-acceptance.result }}"
            exit 1
          fi
          if [ "${{ needs.portable-skills.result }}" != "success" ]; then
            echo "portable Skills result: ${{ needs.portable-skills.result }}"
            exit 1
          fi
          if [ "${{ needs.offline-acceptance.result }}" != "success" ]; then
            echo "offline acceptance result: ${{ needs.offline-acceptance.result }}"
            exit 1
          fi
          if [ "${{ needs.beta-snapshot.result }}" != "success" ]; then
            echo "beta snapshot result: ${{ needs.beta-snapshot.result }}"
            exit 1
          fi
          if [ "${{ needs.single-gates.result }}" != "success" ]; then
            echo "single gate result: ${{ needs.single-gates.result }}"
            exit 1
          fi
          if [ "${{ needs.parallel-gates.result }}" != "success" ]; then
            echo "parallel gate result: ${{ needs.parallel-gates.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "frontend result: ${{ needs.frontend.result }}"
            exit 1
          fi
          echo "make-all split gates passed"
