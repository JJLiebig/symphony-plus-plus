name: operator-labels-format
on:
  pull_request:
    branches: [beta]
jobs:
  format-and-focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Format changed Elixir files
        working-directory: elixir
        run: |
          mix deps.get
          git diff --name-only origin/beta...HEAD -- '*.ex' '*.exs' | sed 's|^elixir/||' | xargs mix format
          git diff --binary > ../operator-labels-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operator-labels-format
          path: operator-labels-format.patch
      - name: Verify operator labels
        working-directory: elixir
        run: mix test test/symphony_elixir/symphony_plus_plus/dashboard_api_local_operator_visibility_test.exs
