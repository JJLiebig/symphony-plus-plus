name: temporary-worker-source
on: pull_request
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          install: true
          cache: true
          working_directory: elixir
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
      - name: Format only this branch's Elixir sources
        working-directory: elixir
        run: |
          mix deps.get
          git diff --name-only origin/beta...HEAD -- '*.ex' '*.exs' | sed 's#^elixir/##' | xargs mix format
      - name: Export contract fingerprint without starting the app
        working-directory: elixir
        run: |
          mix run --no-start -e 'path = "priv/symphony_plus_plus/mcp_contract.json"; contract = path |> File.read!() |> Jason.decode!(); contract = Map.put(contract, "mcp_contract_fingerprint", SymphonyElixir.SymphonyPlusPlus.MCP.Health.mcp_contract_identity()["fingerprint"]); File.write!(path, Jason.encode!(contract, pretty: true) <> "\n")'
      - name: Capture source changes
        if: always()
        run: git diff --binary > hosted-source.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-source
          path: hosted-source.patch
